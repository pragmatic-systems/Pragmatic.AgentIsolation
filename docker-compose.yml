services:
  pi-agent:
    build: .
    image: pi-agent-isolation-host
    container_name: pi-agent-isolation-host

    # --- Security ---
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # --- TTY for interactive Pi TUI ---
    tty: true
    stdin_open: true

    # --- Volumes ---
    # ./mount  →  Pi's read-write workspace
    volumes:
      - ./mount:/home/appuser/mount:rw
      - ./models.json:/home/appuser/.pi/agent/models.json:ro
      - pi_cache:/home/appuser/.pi:rw

    # --- Environment ---
    environment:
      - HOME=/home/appuser
      - NODE_ENV=development
      # Point Pi at LM Studio on the host (Docker Desktop for Windows)
      - LMSTUDIO_API_URL=http://host.docker.internal:1234/v1

    # --- Resources ---
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

volumes:
  pi_cache:
    driver: local
